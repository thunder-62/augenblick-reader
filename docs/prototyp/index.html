<style>
/* Layout: one screen, three bands (header / paged reading area / footer nav), no scrolling.
   The reading area flows text into CSS columns exactly one screen wide and pages through them. */
:root {
  --font-body: "Atkinson Hyperlegible", Verdana, "DejaVu Sans", sans-serif;

  --bg: #000000;

  --accent: #FFCB6B;
  --rule: #4A4436;
  --btn-bg: #15130F;
  --btn-border: #7A7059;
  --btn-press: #F2EAD3;
  --btn-press-fg: #000000;
  --mark: #4A3D16;
  --fs: 25px;
  --lh: 2;
  --ws: 0.25em;
  color-scheme: dark;
}
.schema-light {
  --bg: #FAF7F0;
  --fg: #141210;
  --muted: #3A352D;
  --accent: #6E4300;
  --rule: #C9BFA9;
  --btn-bg: #EEE8DA;
  --btn-border: #6F6656;
  --btn-press: #141210;
  --btn-press-fg: #FAF7F0;
  --mark: #FFE29A;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  overflow: hidden;
}
#app {
  height: 100%;

  flex-direction: column;
  background: var(--bg);
  color: var(--fg);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
  gap: 10px;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
header.bar, footer.bar {
  flex: none;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 10px;
}
header.bar { border-bottom: 2px solid var(--rule); padding-bottom: 10px; padding-top: 6px; }
footer.bar { border-top: 2px solid var(--rule); padding-top: 10px; }
.bar > :first-child { justify-self: start; }
.bar > :last-child { justify-self: end; }
.brand {

  background: var(--btn-bg);

.btn.pressed { background: var(--btn-press); color: var(--btn-press-fg); border-color: var(--btn-press); }
.btn[aria-disabled="true"] { opacity: 0.35; }
.btn.small { min-height: 52px; min-width: 0; font-size: 16px; font-weight: 400; }
.btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

#viewport { flex: 1; min-height: 0; overflow: hidden; position: relative; }
#flow {

@media (prefers-reduced-motion: no-preference) {

.card .meta { display: flex; justify-content: space-between; gap: 0.5em; font-size: max(17px, 0.68em); color: var(--muted); }

#sheet label { display: block; font-size: 15px; color: var(--muted); margin: 8px 0 4px; }
.note { font-size: max(16px, 0.6em); color: var(--muted); line-height: 1.4; margin: 0 0 0.8em; break-inside: avoid; }
.end { display: inline-block; width: 1px; height: 1px; }

/* Settings sheet (for the carer only): scrolls normally, normal sizes */
#sheet {
  position: fixed;
  inset: 0;
  z-index: 20;
  background: var(--bg);
  color: var(--fg);
  overflow-y: auto;
  touch-action: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));

  padding-top: calc(16px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));

}
#sheet .inner { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
#sheet h2 { font-size: 22px; margin: 0; }
#sheet h3 { font-size: 15px; margin: 0 0 8px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
#sheet .row { display: flex; flex-wrap: wrap; gap: 8px; }
#sheet .opt {
  font: inherit; font-size: 16px; color: var(--fg); background: var(--btn-bg);
  border: 2px solid var(--btn-border); border-radius: 10px; padding: 10px 14px; min-height: 48px; cursor: pointer;
}
#sheet .opt[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
#sheet .preview { border: 2px solid var(--rule); border-radius: 12px; padding: 12px 14px; font-size: var(--fs); line-height: var(--lh); word-spacing: var(--ws); }
#sheet .hint { font-size: 15px; color: var(--muted); margin: 6px 0 0; }
#sheet .done { align-self: flex-start; }
</style>

/* ---------- Echte Nachrichten: tagesschau-Schnittstelle (live auf dem Gerät) ---------- */
let ARTICLES = [];
let MODE = "loading"; // "live" | "samples" | "loading"
const API = "https://www.tagesschau.de/api2u/news/";
function htmlToText(h) {
  try { return (new DOMParser().parseFromString("<div>" + h + "</div>", "text/html").body.textContent || "").replace(/\s+/g, " ").trim(); }
  catch (e) { return String(h).replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim(); }
}
function fromItem(it, secFallback) {
  const body = [];
  for (const c of (it.content || [])) {
    if (!c || !c.value) continue;
    if (c.type === "text" || c.type === "headline" || c.type === "quotation") {
      const txt = htmlToText(typeof c.value === "string" ? c.value : (c.value.text || ""));
      if (txt.length < 3 || /^(Mehr zum Thema|Dieses Thema im Programm|Hinweis:)/i.test(txt)) continue;
      body.push(c.type === "headline" ? { h: txt } : txt);
    }
  }
  if (!body.length) return null;
  const sec = it.regionId ? "Bayern" : ({ inland: "Deutschland", ausland: "Welt", wirtschaft: "Wirtschaft", sport: "Sport", wissen: "Wissen", investigativ: "Recherche" }[it.ressort] || secFallback);
  return {
    id: it.sophoraId || it.externalId || it.title,
    sec, title: it.title || it.topline || "",
    sum: it.firstSentence || (typeof body[0] === "string" ? body[0] : ""),
    body, live: true, url: it.shareURL || ""
  };
}
/* Prototyp: erst direkt, sonst über öffentliche Vermittler (nur öffentliche Nachrichten, keine persönlichen Daten).
   Im echten Produkt übernimmt das der eigene Server. */
const ROUTES = [
  { name: "direkt", wrap: u => u },
  { name: "allorigins", wrap: u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u) },
  { name: "corsproxy", wrap: u => "https://corsproxy.io/?url=" + encodeURIComponent(u) }
];
let routeUsed = null;
const errors = [];
async function fetchVia(route, url) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 12000);
  try {
    const r = await fetch(route.wrap(url), { cache: "no-store", signal: ctrl.signal });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return await r.text();
  } finally { clearTimeout(timer); }
}
async function getJson(url) { return JSON.parse(await getText(url)); }
async function getText(url) {
  const order = routeUsed ? [routeUsed, ...ROUTES.filter(r => r !== routeUsed)] : ROUTES;
  for (const route of order) {
    try { const j = await fetchVia(route, url); routeUsed = route; return j; }
    catch (e) { errors.push(route.name + ": " + (e.name === "AbortError" ? "Zeitüberschreitung" : e.message)); }
  }
  throw new Error("nicht erreichbar");
}
/* BR24 Mittelfranken (RSS/RDF). Volltext: aus dem Feed, sonst von der Artikelseite, sonst nur Anreißer. */
const BR_FEED = "https://nachrichtenfeeds.br.de/rdf/boards/UZlNk5T";
function xmlText(el, names) {
  for (const n of names) {
    const hit = el.getElementsByTagName(n)[0] || (n.includes(":") ? el.getElementsByTagNameNS("*", n.split(":")[1])[0] : null);
    if (hit && hit.textContent.trim()) return hit.textContent.trim();
  }
  return "";
}
function paragraphsFromHtml(html) {
  const doc = new DOMParser().parseFromString(html, "text/html");
  for (const s of doc.querySelectorAll('script[type="application/ld+json"]')) {
    try {
      const data = JSON.parse(s.textContent);
      const list = Array.isArray(data) ? data : (data["@graph"] || [data]);
      for (const d of list) if (d && typeof d.articleBody === "string" && d.articleBody.length > 300)
        return d.articleBody.split(/\n+/).map(x => x.trim()).filter(x => x.length > 2);
    } catch (e) {}
  }
  const ps = [...doc.querySelectorAll("article p, main p")].map(p => p.textContent.replace(/\s+/g, " ").trim()).filter(x => x.length > 40);
  return ps.length >= 2 ? ps : [];
}
async function loadBR(max) {
  const xml = new DOMParser().parseFromString(await getText(BR_FEED), "text/xml");
  const items = [...xml.getElementsByTagName("item")].slice(0, max);
  const arts = await Promise.all(items.map(async it => {
    const title = xmlText(it, ["title"]);
    const link = xmlText(it, ["link"]) || it.getAttribute("rdf:about") || "";
    const teaser = htmlToText(xmlText(it, ["description", "dc:description"]));
    const encoded = xmlText(it, ["content:encoded"]);
    let body = [], full = false;
    if (encoded && encoded.length > 600) {
      body = [...new DOMParser().parseFromString(encoded, "text/html").querySelectorAll("p")].map(p => p.textContent.replace(/\s+/g, " ").trim()).filter(x => x.length > 2);
      full = body.length > 0;
    }
    if (!full && link) { try { body = paragraphsFromHtml(await getText(link)); full = body.length > 0; } catch (e) {} }
    if (!full) body = teaser ? [teaser] : [];
    if (!title || !body.length) return null;
    return { id: "br:" + (link || title), sec: "Mittelfranken", title, sum: teaser || body[0], body, live: true, src: full ? "BR24" : "BR24 (nur Anreißer)" };
  }));
  return arts.filter(Boolean);
}
async function loadNews() {
  const [br, ...lists] = await Promise.allSettled([loadBR(4), getJson(API + "?regions=2"), getJson(API)]);
  if (br.status === "rejected") errors.push("BR24: " + br.reason.message);
  const out = br.status === "fulfilled" ? br.value.slice() : [], seen = new Set(out.map(a => a.title.toLowerCase()));
  const take = (res, max, secFallback) => {
    if (res.status !== "fulfilled") return;
    let n = 0;
    for (const it of (res.value.news || [])) {
      if (n >= max) break;
      if (it.type && it.type !== "story") continue;
      const a = fromItem(it, secFallback);
      if (!a || !a.title || seen.has(a.id) || seen.has(a.title.toLowerCase())) continue;
      seen.add(a.id); seen.add(a.title.toLowerCase()); out.push(a); n++;
    }
  };
  // Falls die Liste keine Artikeltexte mitliefert: Details einzeln nachladen
  for (const res of lists) {
    if (res.status !== "fulfilled") continue;
    const items = (res.value.news || []).filter(it => (!it.type || it.type === "story") && !(it.content && it.content.length) && it.details).slice(0, 12);
    const det = await Promise.allSettled(items.map(it => getJson(it.details)));
    det.forEach((d, k) => { if (d.status === "fulfilled") Object.assign(items[k], d.value); });
  }
  take(lists[0], 2, "Bayern");
  take(lists[1], 12 - out.length, "Nachrichten");
  if (!out.length) { errors.push(lists.some(l => l.status === "fulfilled") ? "Antwort enthielt keine lesbaren Artikel" : "keine Liste geladen"); throw new Error("leer"); }
  return out;
}

/* ---------- Einstellungen ---------- */

  get(k, d) { try { const v = localStorage.getItem("augenblick." + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },

const readSet = new Set(store.get("read", []));
const state = { view: "overview", articleId: null, page: 0, pages: 1, ovPage: 0 };
const last = store.get("last", null);
let loadedAt = "";

const app = document.getElementById("app");
const top = document.getElementById("top");
const bottom = document.getElementById("bottom");
const viewport = document.getElementById("viewport");
const flow = document.getElementById("flow");
const sheet = document.getElementById("sheet");
const GAP = 48;

function applySettings() {
  app.className = settings.schema === "light" ? "schema-light" : "schema-dark";
  sheet.className = app.className;
  document.body.style.background = settings.schema === "light" ? "#FAF7F0" : "#000000";
  const r = document.documentElement.style;
  r.setProperty("--fs", SIZES[settings.size] + "px");
  r.setProperty("--lh", String(settings.lh));
}

/* ---------- Hilfen ---------- */
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const splitSentences = t => t.split(/(?<=[.!?:])\s+(?=[A-ZÄÖÜ„"])/);
const minutes = a => Math.max(1, Math.round(a.body.map(b => typeof b === "string" ? b : b.h).join(" ").split(/\s+/).length / 70));
const ICON_SPEAK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const ICON_STOP = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>';
function today() {
  const narrow = window.innerWidth <= 600;
  try { return new Intl.DateTimeFormat("de-DE", narrow ? { weekday: "short", day: "numeric", month: "short" } : { weekday: "long", day: "numeric", month: "long" }).format(new Date()); }
  catch (e) { return ""; }
}

/* ---------- Seiten berechnen (CSS-Spalten = Seiten) ---------- */
function layout(keepSentence) {
  const W = viewport.clientWidth;
  flow.classList.remove("animate");
  flow.style.width = W + "px";
  flow.style.columnWidth = W + "px";
  flow.style.columnGap = GAP + "px";
  const end = flow.querySelector(".end");
  const step = W + GAP;
  const pages = end ? Math.floor((end.offsetLeft + 1) / step) + 1 : 1;
  if (state.view === "article") {
    state.pages = pages;
    if (keepSentence != null) {
      const el = flow.querySelector('.s[data-i="' + keepSentence + '"]');
      if (el) state.page = Math.floor(el.offsetLeft / step);
    }
    state.page = Math.min(Math.max(0, state.page), pages - 1);
  } else {
    state.ovPages = pages;
    state.ovPage = Math.min(Math.max(0, state.ovPage), pages - 1);
  }
  shift(false);
}
function shift(animate) {
  const W = viewport.clientWidth;
  const p = state.view === "article" ? state.page : state.ovPage;
  if (animate) flow.classList.add("animate"); else flow.classList.remove("animate");
  flow.style.transform = "translateX(" + (-p * (W + GAP)) + "px)";
  renderBars();
  save();
}
function pageOf(el) { return Math.floor(el.offsetLeft / (viewport.clientWidth + GAP)); }
function firstSentenceOnPage() {
  const all = flow.querySelectorAll(".s");
  for (const el of all) if (pageOf(el) >= state.page) return Number(el.dataset.i);
  return 0;
}

/* ---------- Ansichten ---------- */
function renderOverview() {
  stopSpeaking();
  releaseWake();
  state.view = "overview";
  if (MODE === "loading") { flow.innerHTML = '<p>Die Nachrichten werden geladen …</p><span class="end"></span>'; layout(); return; }
  let html = MODE === "live" ? '<p class="note">Nachrichten von BR24 und tagesschau.de · Stand ' + esc(loadedAt) + (routeUsed && routeUsed.name !== "direkt" ? " · über " + esc(routeUsed.name) : "") + '</p>' : '<p class="note">Keine Verbindung zu tagesschau.de (' + esc([...new Set(errors)].slice(-4).join("; ")) + '). Frei erfundene Beispieltexte.</p>';
  for (const a of ARTICLES) {
    html += '<article class="card" data-act="open" data-id="' + a.id + '" role="button" tabindex="0" aria-label="' + esc(a.title) + ' öffnen">' +
      '<div class="meta"><span class="sec">' + esc(a.sec) + '</span><span>' + (readSet.has(a.id) ? "✓ gelesen · " : "") + "ca. " + minutes(a) + " Min.</span></div>" +
      "<h2>" + esc(a.title) + "</h2>" +
      '<p class="sum">' + (a.ai ? SPARK : "") + esc(a.sum) + "</p></article>";
  }
  flow.innerHTML = html + '<span class="end"></span>';
  layout();
}
function renderArticle(id, keepSentence) {
  const a = ARTICLES.find(x => x.id === id);
  if (!a) return renderOverview();
  const changed = state.articleId !== id || state.view !== "article";
  state.view = "article";
  state.articleId = id;
  if (changed && keepSentence == null) state.page = state.page || 0;
  let i = 0, html = "<h1>" + esc(a.title) + '</h1><p class="src">' + esc(a.sec) + (a.live ? " · Quelle: " + (a.src || "tagesschau.de") : " · Beispieltext") + "</p>";
  for (const para of a.body) {
    if (typeof para !== "string") { html += '<p><b>' + esc(para.h) + '</b></p>'; continue; }
    html += "<p>" + splitSentences(para).map(s => '<span class="s" data-i="' + (i++) + '">' + esc(s) + "</span>").join(" ") + "</p>";
  }
  flow.innerHTML = html + '<span class="end"></span>';
  readSet.add(id);
  store.set("read", [...readSet]);
  layout(keepSentence);
  requestWake();
}
function renderBars() {
  top.classList.toggle("ov", state.view === "overview");
  if (state.view === "overview") {
    top.innerHTML =
      '<span class="brand">Augenblick</span>' +
      '<span class="dateline">' + esc(today()) + "</span>" +
      '<button class="btn small" data-act="settings" type="button">Einstellungen</button>';
    const p = state.ovPage, n = state.ovPages || 1;
    bottom.innerHTML =
      btn("prev", "◂ Zurück", p <= 0) +
      '<span class="pageinfo">Seite ' + (p + 1) + "<br>von " + n + "</span>" +
      btn("next", "Weiter ▸", p >= n - 1);
  } else {
    const speaking = speech.on;
    top.innerHTML =
      btn("home", "◂ Übersicht", false) +
      "<span></span>" +
      (settings.tts && "speechSynthesis" in window
        ? '<button class="btn" type="button" data-act="speak">' + (speaking ? ICON_STOP + "Anhalten" : ICON_SPEAK + "Vorlesen") + "</button>"
        : "<span></span>");
    const p = state.page, n = state.pages;
    const lastPage = p >= n - 1;
    const idx = ARTICLES.findIndex(x => x.id === state.articleId);
    const hasNext = idx < ARTICLES.length - 1;
    bottom.innerHTML =
      btn("prev", "◂ Zurück", p <= 0) +
      '<span class="pageinfo">Seite ' + (p + 1) + "<br>von " + n + "</span>" +
      (lastPage ? btn(hasNext ? "nextArticle" : "home", hasNext ? "Nächster Artikel ▸" : "Zur Übersicht ▸", false) : btn("next", "Weiter ▸", false));
  }
}
function btn(act, label, disabled) {
  return '<button class="btn" type="button" data-act="' + act + '"' + (disabled ? ' aria-disabled="true"' : "") + ">" + esc(label) + "</button>";
}

/* ---------- Aktionen ---------- */
function act(name, el) {
  if (name === "open") { state.page = 0; stopSpeaking(); renderArticle(el.dataset.id); return; }
  if (name === "home") { renderOverview(); return; }
  if (name === "settings") { openSheet(); return; }
  if (name === "speak") { speech.on ? stopSpeaking() : speakFrom(firstSentenceOnPage()); return; }
  if (name === "nextArticle") {
    const idx = ARTICLES.findIndex(x => x.id === state.articleId);
    state.page = 0; stopSpeaking(); renderArticle(ARTICLES[idx + 1].id); return;
  }
  if (name === "prev" || name === "next") {
    const d = name === "next" ? 1 : -1;
    if (state.view === "article") {
      const np = state.page + d;
      if (np < 0 || np >= state.pages) return;
      stopSpeaking(); state.page = np;
    } else {
      const np = state.ovPage + d;
      if (np < 0 || np >= (state.ovPages || 1)) return;
      state.ovPage = np;
    }
    shift(true);
  }
}

/* ---------- Tipp-Erkennung: nur einfache Tipps ---------- */
let down = null, lastTap = 0;
app.addEventListener("pointerdown", e => {
  if (!e.isPrimary) { down = null; return; }
  down = { x: e.clientX, y: e.clientY, t: performance.now(), target: e.target };
  const pressable = e.target.closest(".btn, .card");
  if (pressable && pressable.getAttribute("aria-disabled") !== "true") pressable.classList.add("pressed");
});
function clearPressed() { app.querySelectorAll(".pressed").forEach(el => el.classList.remove("pressed")); }
app.addEventListener("pointercancel", () => { clearPressed(); });
app.addEventListener("pointerup", e => {
  setTimeout(clearPressed, 150);
  if (down && e.isPrimary) { down.upX = e.clientX; down.upY = e.clientY; down.upT = performance.now(); }
});
/* Ausgelöst wird beim Klick-Ereignis des Browsers. Das kommt auch dann,
   wenn die umgebende App die Berührung kurz für sich beansprucht hat. */
app.addEventListener("click", e => {
  const d = down; down = null;
  const now = performance.now();
  if (d && d.upT) {
    const dt = d.upT - d.t;
    const moved = Math.hypot(d.upX - d.x, d.upY - d.y);
    if (dt < 30 || moved > 40) return;        // Zucken oder Streifen
  }
  if (now - lastTap < 300) return;            // Doppeltipp ignorieren
  lastTap = now;
  handleTap(e.target);
});
app.addEventListener("keydown", e => {
  const c = e.target.closest(".card");
  if (c && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); handleTap(c); }
});
function handleTap(target) {
  const b = target.closest("[data-act]");
  if (b) { if (b.getAttribute("aria-disabled") !== "true") act(b.dataset.act, b); return; }
  const s = target.closest(".s");
  if (s && state.view === "article" && settings.tts && "speechSynthesis" in window) {
    if (speech.on) stopSpeaking(); else speakFrom(Number(s.dataset.i));
  }
}
document.addEventListener("contextmenu", e => { if (app.contains(e.target)) e.preventDefault(); });

/* ---------- Vorlesen: ab angetipptem Satz, aktueller Satz markiert ---------- */
const speech = { on: false, token: 0 };
function germanVoice() {
  const vs = speechSynthesis.getVoices();
  return vs.find(v => /^de(-|_)DE/i.test(v.lang) && /google|samsung|natural/i.test(v.name)) ||
         vs.find(v => /^de(-|_)DE/i.test(v.lang)) || vs.find(v => /^de/i.test(v.lang)) || null;
}
function speakFrom(i) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  speech.on = true;
  const token = ++speech.token;
  renderBars();
  const step = k => {
    if (!speech.on || token !== speech.token) return;
    const el = flow.querySelector('.s[data-i="' + k + '"]');
    if (!el) { stopSpeaking(); return; }
    flow.querySelectorAll(".s.now").forEach(x => x.classList.remove("now"));
    el.classList.add("now");
    const pg = pageOf(el);
    if (pg !== state.page) { state.page = pg; shift(true); }
    const u = new SpeechSynthesisUtterance(el.textContent);
    u.lang = "de-DE";
    const v = germanVoice(); if (v) u.voice = v;
    u.rate = settings.rate;
    u.onend = () => step(k + 1);
    u.onerror = () => { if (token === speech.token) stopSpeaking(); };
    speechSynthesis.speak(u);
  };
  step(i);
}
function stopSpeaking() {
  speech.on = false;
  speech.token++;
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  flow.querySelectorAll(".s.now").forEach(x => x.classList.remove("now"));
  if (state.view === "article") renderBars();
}
if ("speechSynthesis" in window) speechSynthesis.onvoiceschanged = () => {};

/* ---------- Bildschirm wach halten im Artikel ---------- */
let wake = null;
async function requestWake() {
  try { if ("wakeLock" in navigator && !wake) { wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => { wake = null; }); } } catch (e) { wake = null; }
}
function releaseWake() { try { if (wake) wake.release(); } catch (e) {} wake = null; }
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && state.view === "article") requestWake();
  if (document.visibilityState === "hidden") stopSpeaking();
});

/* ---------- Einstellungen (nur für Angehörige) ---------- */
function openSheet() {
  stopSpeaking();
  const opt = (key, val, label) =>
    '<button class="opt" type="button" data-key="' + key + '" data-val="' + val + '" aria-pressed="' + (String(settings[key]) === String(val)) + '">' + label + "</button>";
  const hasVoice = "speechSynthesis" in window;
  sheet.innerHTML =
    '<div class="inner">' +
    "<h2>Einstellungen</h2>" +
    "<p class=\"hint\" style=\"margin:0\">Gedacht für Angehörige. Am besten gemeinsam ausprobieren: die erste Schriftgröße wählen, die sich angenehm liest, oder eine Stufe größer.</p>" +
    "<section><h3>Schriftgröße</h3><div class=\"row\">" +
      SIZES.map((s, i) => opt("size", i, "Stufe " + (i + 1) + " (" + s + " px)")).join("") +
    "</div></section>" +
    "<section><h3>Farbschema</h3><div class=\"row\">" +
      opt("schema", "dark", "Hell auf Schwarz") + opt("schema", "light", "Dunkel auf Hell") +
    "</div><p class=\"hint\">Beide ausprobieren. Welches besser passt, hängt vom Auge ab.</p></section>" +
    "<section><h3>Zeilenabstand</h3><div class=\"row\">" +
      opt("lh", 1.5, "1,5-fach") + opt("lh", 2, "Doppelt (empfohlen)") +
    "</div></section>" +
    "<section><h3>Vorlesen</h3><div class=\"row\">" +
      opt("tts", true, "An") + opt("tts", false, "Aus") +
    "</div><div class=\"row\" style=\"margin-top:8px\">" +
      opt("rate", 0.75, "Langsam") + opt("rate", 0.85, "Ruhig") + opt("rate", 1, "Normal") +
    "</div><p class=\"hint\">" + (hasVoice ? "Im Artikel auf einen Satz tippen: Ab dort wird vorgelesen. Nochmal tippen hält an." : "Dieser Browser kann nicht vorlesen.") + "</p></section>" +
    "<section><h3>Vorschau</h3><div class=\"preview\">Wer am Fluss spazieren geht, kann sich jetzt öfter ausruhen. Die neuen Bänke haben Armlehnen.</div></section>" +
    "<section><h3>KI-Zusammenfassungen (OpenRouter)</h3>" +
      "<p class=\"hint\" style=\"margin:0 0 4px\">Nur für diesen Prototyp, mit einem kostenlosen Modell (Endung :free). Ein kostenloses OpenRouter-Konto mit Schlüssel ist trotzdem nötig. Der Schlüssel bleibt in diesem Browser auf diesem Gerät. Ohne Schlüssel erscheinen die Anreißer von BR24 und tagesschau, ohne ✦.</p>" +
      '<label for="orkey">API-Schlüssel</label><input id="orkey" type="password" autocomplete="off" spellcheck="false" placeholder="sk-or-…" value="' + esc(orKey) + '">' +
      '<label for="ormodel">Modell</label><input id="ormodel" type="text" autocomplete="off" spellcheck="false" value="' + esc(orModel) + '">' +
      '<p class="hint">' + esc(aiStatus) + "</p>" +
    "</section>" +
    "<section><h3>Lesestand</h3><div class=\"row\">" +
      '<button class="opt" type="button" data-reset="1">Gelesen-Markierungen zurücksetzen</button>' +
    "</div></section>" +
    '<button class="btn done" type="button" data-close="1">Fertig</button>' +
    "</div>";
  sheet.hidden = false;
}
sheet.addEventListener("click", e => {
  const o = e.target.closest(".opt");
  if (o && o.dataset.key) {
    const k = o.dataset.key; let v = o.dataset.val;
    v = (k === "schema") ? v : (v === "true" ? true : v === "false" ? false : Number(v));
    settings[k] = v;
    store.set("settings", settings);
    applySettings();
    sheet.querySelectorAll('.opt[data-key="' + k + '"]').forEach(x => x.setAttribute("aria-pressed", String(x.dataset.val) === String(v)));
    return;
  }
  if (e.target.closest("[data-reset]")) { readSet.clear(); store.set("read", []); return; }
  if (e.target.closest("[data-close]")) { sheet.hidden = true; renderOverview(); }
});

/* ---------- Start ---------- */
function save() {
  if (state.view === "article") store.set("last", { id: state.articleId, page: state.page });
  else store.set("last", null);
}
let resizeT = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => {
    if (state.view === "article") renderArticle(state.articleId, speech.on ? null : firstSentenceOnPage());
    else layout();
  }, 120);
});
applySettings();
function finishLoad(list, mode) {
  ARTICLES = list; MODE = mode;
  try { loadedAt = new Intl.DateTimeFormat("de-DE", { hour: "2-digit", minute: "2-digit" }).format(new Date()) + " Uhr"; } catch (e) {}
  if (state.view === "article" && ARTICLES.some(a => a.id === state.articleId)) return; // nicht beim Lesen stören
  if (last && state.view === "overview" && !started && ARTICLES.some(a => a.id === last.id)) {
    started = true; state.page = last.page || 0; renderArticle(last.id); return;
  }
  started = true;
  if (state.view !== "article") renderOverview();
}
let started = false;
sheet.addEventListener("change", e => {
  if (e.target.id === "orkey") { orKey = e.target.value.trim(); store.set("orkey", orKey); }
  if (e.target.id === "ormodel") { orModel = e.target.value.trim() || DEFAULT_MODEL; store.set("ormodel", orModel); }
  if (e.target.id === "orkey" || e.target.id === "ormodel") summarizeAll();
});

/* ---------- KI-Zusammenfassungen über OpenRouter (Prototyp: direkt aus dem Browser) ---------- */
const DEFAULT_MODEL = "qwen/qwen3-next-80b-a3b-instruct:free"; // kostenloses Modell
let orKey = store.get("orkey", "");
let orModel = store.get("ormodel", DEFAULT_MODEL);
let aiStatus = "Noch keine Zusammenfassungen erzeugt.";
const SPARK = '<svg class="spark" viewBox="0 0 24 24" role="img" aria-label="KI-Zusammenfassung"><path fill="currentColor" d="M12 1.5c.9 5.8 4.7 9.6 10.5 10.5-5.8.9-9.6 4.7-10.5 10.5C11.1 16.7 7.3 12.9 1.5 12 7.3 11.1 11.1 7.3 12 1.5z"/></svg>';
const PROMPT = "Fasse den folgenden Zeitungsartikel für eine ältere Leserin in zwei bis drei kurzen Sätzen auf Deutsch zusammen. " +
  "Sachlich, ohne Wertung, keine Informationen, die nicht im Text stehen, keine Fremdwörter ohne Not, höchstens 45 Wörter. " +
  "Antworte nur mit der Zusammenfassung, ohne Einleitung.";
async function summarize(a) {
  const cacheKey = "sum:" + orModel + ":" + a.id;
  const cached = store.get(cacheKey, null);
  if (cached) return cached;
  const text = a.body.map(b => typeof b === "string" ? b : b.h).join("\n").slice(0, 8000);
  const r = await fetch("https://openrouter.ai/api/v1/chat/completions", {
    method: "POST",
    headers: { "Authorization": "Bearer " + orKey, "Content-Type": "application/json", "HTTP-Referer": location.origin || "https://thunder-62.github.io", "X-Title": "Augenblick" },
    body: JSON.stringify({ model: orModel, temperature: 0.2, max_tokens: 200,
      messages: [{ role: "system", content: PROMPT }, { role: "user", content: a.title + "\n\n" + text }] })
  });
  if (!r.ok) throw new Error("HTTP " + r.status);
  const j = await r.json();
  const out = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content || "").trim();
  const words = out.split(/\s+/).length;
  if (!out || words > 70) throw new Error("unbrauchbare Antwort");
  store.set(cacheKey, out);
  return out;
}
let summarizing = false;
async function summarizeAll() {
  if (!orKey || summarizing || MODE !== "live") { if (!orKey) aiStatus = "Kein Schlüssel eingetragen."; return; }
  summarizing = true;
  let ok = 0, fail = 0, lastErr = "";
  const todo = ARTICLES.filter(a => a.live && a.body.length > 1);
  for (let k = 0; k < todo.length; k += 3) {
    await Promise.all(todo.slice(k, k + 3).map(async a => {
      try { a.sum = await summarize(a); a.ai = true; ok++; }
      catch (e) { fail++; lastErr = e.message; }
    }));
    if (state.view === "overview" && sheet.hidden) { const p = state.ovPage; renderOverview(); state.ovPage = p; layout(); }
  }
  aiStatus = ok + " Zusammenfassungen von " + orModel + (fail ? ", " + fail + " fehlgeschlagen (" + lastErr + ")" : "") + ".";
  summarizing = false;
}
async function refresh() {
  try { finishLoad(await loadNews(), "live"); summarizeAll(); }
  catch (e) { if (MODE !== "live") finishLoad(SAMPLES, "samples"); }
}
renderOverview();
refresh();
setInterval(() => { if (state.view === "overview") refresh(); }, 30 * 60 * 1000);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { state.view === "article" ? layout(firstSentenceOnPage()) : layout(); });
})();
</script>
