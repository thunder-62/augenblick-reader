name: Release

# Jeder Merge nach main ist eine Freigabe: GitHub baut das Paket, der Pi holt es nachts
# um 03:00 (deploy/update.sh). Reine Doku-Änderungen lösen kein Release aus (ADR 019).
# Ein Tag v… von Hand erzeugt weiterhin ein Release mit genau dieser Version.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release-Paket bauen und veröffentlichen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Version bestimmen
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # Major.Minor aus package.json, Patch = fortlaufende Nummer dieses Workflows
            BASE="$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")"
            VERSION="${BASE}.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Bauen
        run: npm run build
        env:
          AUGENBLICK_VERSION: ${{ steps.version.outputs.version }}
      - name: Paket
        run: npm run package
        env:
          AUGENBLICK_VERSION: ${{ steps.version.outputs.version }}
      - name: GitHub-Release mit Paket als Asset
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG gibt es schon – nichts zu tun."
            exit 0
          fi
          gh release create "$TAG" release/augenblick-*.tar.gz release/augenblick-*.tar.gz.sha256 \
            --target "$GITHUB_SHA" --title "$TAG" --generate-notes
